# Runs the pytest suite on every push and pull request. release.yml calls
# this workflow so the same jobs gate every GitHub Release.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Verify runtime versions
        run: python -c "from importlib.metadata import version; import sys; print(version('homeassistant')); assert sys.version_info[:2] == (3, 14)"
      - name: Run the suite
        run: pytest tests/ -q --cov=custom_components/event_scout --cov-report=term-missing
      - name: Lint
        run: ruff check custom_components/event_scout tests
      - name: Format check
        run: ruff format --check custom_components/event_scout tests
      - name: Type check
        run: mypy --python-version 3.14 custom_components/event_scout/
