# Catches the class of problem that breaks a HACS install before a release
# is cut. The weekly run catches drift in the validators themselves.
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main on 2026-08-30
        with:
          category: integration
          # This repository stays a custom (non-default-store) HACS repository for now, so
          # brand assets are not required (see quality_scale.yaml). license is skipped off main
          # because hacs/action reads license metadata from the default branch only.
          ignore: brands${{ github.ref != 'refs/heads/main' && ' license' || '' }}

  hassfest:
    name: hassfest (manifest sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master on 2026-08-30
